<body>
<div class="md:flex min-h-screen">
 <aside class="md:w-56 bg-white border-b md:border-r border-slate-200 p-3 md:p-4 md:min-h-screen">
  <div class="flex items-center justify-between mb-2 md:mb-6"><div class="font-bold text-indigo-600 text-lg">📘 StudyBuddy</div><button id="themeBtn" onclick="toggleTheme()" class="border rounded-lg px-2 py-1 text-sm bg-white" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button></div>
  <nav id="nav" class="flex md:flex-col gap-1 overflow-x-auto text-sm"></nav>
  <button id="installBtn" onclick="installApp()" class="hidden mt-4 w-full border border-indigo-300 text-indigo-700 rounded-lg px-3 py-2 text-sm bg-white">⬇ Install app</button>
  <p id="netBadge" class="hidden mt-3 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1">Offline: everything still works</p>
</aside>
 <main class="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full"><div id="app"></div></main>
</div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 hidden px-4 py-2 rounded-lg text-sm text-white bg-slate-800 max-w-[90vw] z-50"></div>
